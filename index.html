<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>FQT LOVE GARDEN — 愛を育てるもの</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a1a3d">

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LOVE GARDEN">

<link rel="stylesheet" href="style.css?v=37">
</head>
<body>
<div class="app">

  <!-- 宇宙どうぶつ選択画面 -->
  <div id="selectScreen">
    <p class="title" style="text-align:center">宇宙どうぶつを選ぶ</p>
    <p class="stage-desc" style="text-align:center;max-width:340px;margin:6px auto 18px">
      13種類の宇宙どうぶつから、あなたと歩む1体を選んでください。<br>
      まだ小さく、シンプルなすがたです。
    </p>
    <div class="species-grid" id="speciesGrid"></div>
    <button class="save-btn" id="tutorialReopenBtnSelect" style="display:block;margin:18px auto 0">🚀 チュートリアルを見る</button>
  </div>

  <!-- ゲーム本編 -->
  <div id="gameScreen" style="display:none">
    <div class="header">
      <img class="brand-badge" src="fqt-badge.png" alt="FQT Quantum Tunergy Certified">
      <p class="title">愛 を 育 て る も の</p>
      <h2 class="fqt-brand">FQT LOVE GARDEN</h2>

      <div class="music-panel">
        <button class="bgm-btn" id="musicPlayBtn" type="button">🎵　癒しのBGMを再生</button>
        <select class="bgm-preset-select" id="musicSelect"></select>
        <select class="bgm-preset-select" id="musicSleepSelect">
          <option value="0">⏱ スリープタイマー：なし</option>
          <option value="10">⏱ 10分で停止</option>
          <option value="20">⏱ 20分で停止</option>
          <option value="30">⏱ 30分で停止</option>
          <option value="60">⏱ 60分で停止</option>
        </select>
        <p class="music-status" id="musicStatus"></p>
        <label class="power-toggle sfx-toggle">
          <input type="checkbox" id="sfxToggle" checked>
          🔔 効果音を鳴らす（ファンファーレ・出会いの音）
        </label>
      </div>

      <div class="creature-info">
        <p class="creature-name" id="creatureName"></p>
        <h1 class="stage-name" id="stageName">芽生えの光</h1>
        <p class="stage-desc" id="stageDesc">まだ小さく、ゆらいでいる愛の光。</p>
        <p class="love-total">愛のパワー <b id="loveTotal">0</b></p>
        <p class="mentor-count">出会ったメンター <b id="mentorCount">0</b> 人</p>
        <label class="power-toggle">
          <input type="checkbox" id="showPowerToggle">
          愛のパワー指標を表示する
        </label>
        <label class="power-toggle">
          <input type="checkbox" id="readAloudToggle">
          設問を読み上げる
        </label>
        <div class="read-speed-row" id="readSpeedRow" style="display:none">
          <span>速さ</span>
          <input type="range" id="readSpeedSlider" min="0.5" max="2" step="0.1" value="1">
          <span id="readSpeedLabel">1.0x</span>
        </div>
      </div>

      <div class="creature-wrap" id="creatureMount"></div>
    </div>

    <div class="progress-wrap">
      <p class="progress-caption">ここまでの歩み</p>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <p class="progress-label" id="progressLabel">0 / 0 問</p>
    </div>

    <div class="card" id="questionCard">
      <p class="eyebrow" id="questionCategory">思いやり</p>
      <p class="question-text" id="questionText">読み込み中…</p>
      <button class="replay-btn" id="replayBtn">🔊 もう一度読み上げる</button>
      <div class="choices" id="choices"></div>
      <button class="back-btn" id="backBtn" style="display:none">← 戻って選び直す</button>
    </div>

    <details class="ego-details">
      <summary>地球人ぽい指標（愛が育つと小さくなる）</summary>
      <div id="egoPanel"></div>
    </details>

    <footer class="foot">
      不思議な、愛を育てる小さな物語。<br>
      <button class="save-btn" id="saveBtn">💾 保存して一旦やめる</button>
      <button class="reset-btn" id="resetBtn">🔄 最初からやり直す</button>
      <button class="save-btn" id="tutorialReopenBtn">🚀 チュートリアルを見る</button>
    </footer>
  </div>
</div>

<!-- 選択後フィードバック -->
<div class="feedback-overlay" id="feedbackOverlay">
  <div class="feedback-card" id="feedbackCard"></div>
</div>

<!-- 🚀 ホーム画面追加を促すポップアップ -->
<div class="feedback-overlay" id="pwaPromptOverlay">
  <div class="feedback-card" id="pwaPromptCard"></div>
</div>

<script src="creature.js?v=37"></script>
<script src="music.js?v=37"></script>
<script src="app.js?v=37"></script>
</body>
</html>
